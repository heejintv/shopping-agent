<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Pickit 링크 미리보기 이미지 원본 (PNG 변환: og-image.png). 글꼴: Pretendard → 맑은 고딕 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset=".5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0b1440" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 흐릿한 원형 빛 -->
  <circle cx="160" cy="80" r="220" fill="#60a5fa" opacity=".45" filter="url(#blur)"/>
  <circle cx="1080" cy="120" r="200" fill="#c4b5fd" opacity=".45" filter="url(#blur)"/>
  <circle cx="820" cy="640" r="240" fill="#a78bfa" opacity=".4" filter="url(#blur)"/>
  <!-- 은은한 점 무늬 -->
  <g fill="#fff" opacity=".07">
    <circle cx="980" cy="420" r="3"/><circle cx="1020" cy="420" r="3"/><circle cx="1060" cy="420" r="3"/><circle cx="1100" cy="420" r="3"/>
    <circle cx="980" cy="460" r="3"/><circle cx="1020" cy="460" r="3"/><circle cx="1060" cy="460" r="3"/><circle cx="1100" cy="460" r="3"/>
    <circle cx="980" cy="500" r="3"/><circle cx="1020" cy="500" r="3"/><circle cx="1060" cy="500" r="3"/><circle cx="1100" cy="500" r="3"/>
  </g>

  <g font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <!-- 로고: 흰 둥근 사각형 안에 체크 쇼핑백 -->
    <g transform="translate(96 96)" filter="url(#shadow)">
      <rect width="112" height="112" rx="28" fill="#fff"/>
      <g transform="translate(16 14) scale(2.5)">
        <path d="M11 11V9a5 5 0 0 1 10 0v2" fill="none" stroke="url(#logo)" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M6 11h20l-1.4 15.3A3 3 0 0 1 21.6 29H10.4a3 3 0 0 1-3-2.7z" fill="url(#logo)"/>
        <path d="M11.4 19.6l3.3 3.3 6-6.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="236" y="170" fill="#fff" font-size="64" font-weight="800" letter-spacing="-2">Pickit</text>
    <text x="414" y="168" fill="#fff" fill-opacity=".75" font-size="30" font-weight="500">픽잇</text>

    <!-- 문구 -->
    <text x="96" y="352" fill="#fff" font-size="76" font-weight="800" letter-spacing="-3">고민은 짧게,</text>
    <text x="96" y="446" fill="#fff" font-size="76" font-weight="800" letter-spacing="-3">선택은 정확하게</text>
    <text x="98" y="512" fill="#fff" fill-opacity=".82" font-size="28" font-weight="500" letter-spacing="-.5">AI가 웹을 검색해 인기 모델 5개를 비교하고, 딱 맞는 하나를 골라드려요</text>

    <!-- 아래: 기능 칩 + 주소 -->
    <g font-size="22" font-weight="600" fill="#fff">
      <rect x="96" y="548" width="132" height="44" rx="22" fill="#fff" fill-opacity=".16"/>
      <text x="162" y="577" text-anchor="middle">AI 검색</text>
      <rect x="240" y="548" width="132" height="44" rx="22" fill="#fff" fill-opacity=".16"/>
      <text x="306" y="577" text-anchor="middle">1:1 비교</text>
      <rect x="384" y="548" width="132" height="44" rx="22" fill="#fff" fill-opacity=".16"/>
      <text x="450" y="577" text-anchor="middle">AI 상담</text>
    </g>
    <text x="1104" y="577" fill="#fff" fill-opacity=".7" font-size="22" font-weight="500" text-anchor="end">heejintv.github.io/shopping-agent</text>
  </g>
</svg>
