<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가격비교</title>
<script src="config.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #171b24; --muted: #6b7280; --line: #e6e8ec; --soft: #f0f2f5;
    --accent: #2563eb; --accent-soft: #e0eaff;
    --value: #059669; --value-soft: #dcf5ec;
    --quality: #7c3aed; --quality-soft: #ede5ff;
    --cheap: #ea580c; --cheap-soft: #ffeadb;
    --warn: #d97706; --bad: #dc2626;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
    --ai-glow: #2563eb; --ai-glow-soft: rgba(37,99,235,.45); --ai-bg: #fff4b8;   /* 챗봇 추천 강조 */
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1117; --card: #171b23; --text: #e8eaf0; --muted: #9aa3b2; --line: #272d38; --soft: #1f242e;
            --accent: #6ea2ff; --accent-soft: #1d2f52;
            --value: #34d399; --value-soft: #12352a;
            --quality: #b294ff; --quality-soft: #2c2350;
            --cheap: #fb923c; --cheap-soft: #3d2414;
            --warn: #fbbf24; --bad: #f87171; --shadow: none;
            --ai-glow: #6ea2ff; --ai-glow-soft: rgba(110,162,255,.5); --ai-bg: #4a3f12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 36px 16px 72px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  form { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; padding: 13px 16px; font-size: 16px; border: 1px solid var(--line);
         border-radius: 12px; background: var(--card); color: var(--text); box-shadow: var(--shadow); }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; }
  #btn { padding: 0 22px; font-size: 16px; font-weight: 600; border: 0; border-radius: 12px; background: var(--accent); color: #fff; }
  #btn:disabled { opacity: .5; cursor: default; }
  .cond-row { margin-top: 8px; }
  #c { width: 100%; padding: 11px 16px; font-size: 15px; border: 1px solid var(--line); border-radius: 12px;
       background: var(--card); color: var(--text); }
  #c:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .cond-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cond-chip { padding: 4px 11px; font-size: 13px; border-radius: 99px; border: 1px dashed var(--line);
               background: none; color: var(--muted); }
  .cond-chip:hover { border-color: var(--accent); color: var(--accent); }
  .cond-chip::before { content: "+ "; }
  .chip .cond { color: var(--accent); font-size: 13px; }
  .req-cond { margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: var(--accent-soft); color: var(--text); font-size: 15px; }
  .req-cond b { color: var(--accent); }
  .nomatch { margin-top: 12px; }
  .fit { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
  .fit.high { background: var(--value-soft); color: var(--value); }
  .fit.mid { background: var(--cheap-soft); color: var(--cheap); }
  .fit.low { background: var(--soft); color: var(--muted); }
  td.fit-c { min-width: 130px; max-width: 200px; font-size: 13px; }
  td.fit-c .fit-why { display: block; color: var(--muted); margin-top: 4px; }
  .pick .fit { align-self: flex-start; margin-top: 8px; }
  table.no-fit .fit-col { display: none !important; }
  #status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 20px; }
  #status.ok { color: var(--value); }
  #status.bad { color: var(--bad); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 16px; box-shadow: var(--shadow); }
  h2 { font-size: 16px; margin: 0; }
  .na { color: var(--muted); }
  a { color: var(--accent); }

  /* 최근 검색 */
  #recent { display: none; margin-top: 8px; }
  #recent .head { display: flex; align-items: baseline; gap: 8px; }
  #recent .hint { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; font-size: 14px; border-radius: 99px;
          border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip small { color: var(--muted); font-size: 11px; }
  #demo { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 14px;
          background: color-mix(in srgb, var(--warn) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); }
  #demo strong { color: var(--warn); }

  #loading { display: none; align-items: center; gap: 14px; }
  .spinner { width: 24px; height: 24px; flex: none; border: 3px solid var(--accent-soft); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error { display: none; color: var(--bad); }

  /* 추천 카드 */
  #results { display: none; }
  .result-title { display: flex; align-items: baseline; gap: 8px; margin: 28px 0 0; }
  .result-title h2 { font-size: 20px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 12px; }
  .pick { --c: var(--accent); --c-soft: var(--accent-soft);
          position: relative; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line);
          border-top: 4px solid var(--c); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .pick.value { --c: var(--value); --c-soft: var(--value-soft); }
  .pick.quality { --c: var(--quality); --c-soft: var(--quality-soft); }
  .pick.cheap { --c: var(--cheap); --c-soft: var(--cheap-soft); }
  .tag { align-self: flex-start; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--c-soft); color: var(--c); }
  .pick .brand { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .pick .name { font-size: 18px; font-weight: 700; line-height: 1.35; letter-spacing: -.01em; }
  .pick .price { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 10px 0 2px; }
  .pick .store { color: var(--muted); font-size: 13px; }
  .pick .why { font-size: 14px; margin: 12px 0 0; padding: 10px 12px; background: var(--soft); border-radius: 10px; }
  .pick .go { margin-top: auto; padding-top: 14px; }
  .pick .go a { display: inline-block; font-size: 14px; font-weight: 600; color: var(--c); text-decoration: none; }
  .pick .go a:hover { text-decoration: underline; }
  .pick.empty .why { background: none; padding: 0; color: var(--muted); }

  /* 비교표 */
  .table-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 6px 12px; font-size: 13px; font-weight: 600; border-radius: 8px; }
  .seg button[aria-pressed=true] { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  /* separate: 표의 행에도 글로우(box-shadow)·튀어나오기(transform)가 보이게 */
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.model b { display: block; font-weight: 600; }
  td.model .brand { color: var(--muted); font-size: 12px; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
  .badge.value { background: var(--value-soft); color: var(--value); }
  .badge.quality { background: var(--quality-soft); color: var(--quality); }
  .badge.cheap { background: var(--cheap-soft); color: var(--cheap); }
  td.price { white-space: nowrap; font-weight: 700; min-width: 120px; }
  .mini { height: 4px; background: var(--soft); border-radius: 4px; margin-top: 6px; }
  .mini i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  td.store-c { color: var(--muted); font-size: 13px; max-width: 160px; }
  td.rating, td.link { white-space: nowrap; }
  ul.pc { margin: 0; padding-left: 16px; }
  .pros li::marker { color: var(--value); }
  .cons li::marker { color: var(--bad); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .nolink { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* 좁은 화면: 표를 카드 목록으로 */
  @media (max-width: 760px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { padding: 12px 0; border-bottom: 1px solid var(--line); }
    tbody tr:last-child { border-bottom: 0; }
    td { border: 0; padding: 3px 0; max-width: none !important; }
    td[data-label]::before { content: attr(data-label); display: inline-block; width: 52px; color: var(--muted); font-size: 12px; font-weight: 400; }
    td.pc-cell { display: flex; }
    td.pc-cell::before { flex: none; }
    td.price .mini { display: none; }
  }

  /* 상담 챗봇 */
  #chatFab { position: fixed; right: 20px; bottom: 20px; z-index: 20; width: 56px; height: 56px; border: 0; border-radius: 50%;
             background: var(--accent); color: #fff; font-size: 26px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  #chatBox { position: fixed; right: 20px; bottom: 88px; z-index: 21; width: 380px; max-width: calc(100vw - 32px);
             height: min(560px, calc(100vh - 120px)); display: none; flex-direction: column; overflow: hidden;
             background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
  #chatBox.open { display: flex; }
  .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .chat-head small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  #chatClose { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 8px; }
  #chatLog { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 9px 13px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--soft); border-bottom-left-radius: 4px; }
  .msg.info { align-self: center; max-width: 100%; background: none; color: var(--muted); font-size: 13px; text-align: center; }
  .msg.err { align-self: center; background: none; color: var(--bad); font-size: 13px; }
  .msg.wait { color: var(--muted); }
  #chatEx { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
  #chatEx button { padding: 5px 11px; font-size: 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  #chatEx button:hover { border-color: var(--accent); color: var(--accent); }
  #chatForm { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  #chatIn { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  #chatSend { padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }
  #chatSend:disabled, #chatEx button:disabled { opacity: .5; cursor: default; }
  #chatCount { padding: 0 14px 8px; font-size: 12px; color: var(--muted); text-align: right; }
  .pick-link { color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .msg.bot .see { display: inline-block; margin-top: 6px; font-weight: 600; color: var(--accent); }
  /* 챗봇이 추천한 상품 강조 (2.5초): 파란 글로우 + 1.03배 튀어나오기 + 연노랑 배경이 천천히 빠짐 */
  @keyframes aiGlow {
    0%   { box-shadow: 0 0 0 3px var(--ai-glow), 0 0 30px 10px var(--ai-glow-soft); }
    30%  { box-shadow: 0 0 0 3px var(--ai-glow), 0 0 44px 16px var(--ai-glow-soft); }
    60%  { box-shadow: 0 0 0 3px var(--ai-glow), 0 0 26px 8px var(--ai-glow-soft); }
    100% { box-shadow: 0 0 0 0 transparent, 0 0 0 0 transparent; }
  }
  @keyframes aiPop { 0% { transform: scale(1); } 30% { transform: scale(1.03); } 100% { transform: scale(1); } }
  @keyframes aiBg { from { background-color: var(--ai-bg); } }   /* 끝은 원래 배경색으로 */
  .pick.flash, #tbody tr.flash { position: relative; z-index: 2;
    animation: aiGlow 2.5s ease-out, aiPop .7s cubic-bezier(.34, 1.56, .64, 1), aiBg 2.5s ease-out; }
  @media (prefers-reduced-motion: reduce) {   /* 움직임 줄이기: 커지는 효과 없이 색만 */
    .pick.flash, #tbody tr.flash { animation: aiGlow 2.5s ease-out, aiBg 2.5s ease-out; }
  }
  /* "✨ AI 추천" 배지: 다음 질문이나 새 검색 전까지 유지 */
  .ai-badge { display: inline-block; font-size: 12px; font-weight: 700; line-height: 1; padding: 5px 10px; border-radius: 99px;
              background: var(--accent); color: #fff; box-shadow: 0 2px 8px var(--ai-glow-soft); white-space: nowrap; }
  .pick > .ai-badge { position: absolute; top: -12px; right: 14px; z-index: 3; }
  td.model > .ai-badge { margin-bottom: 6px; }
  .pick.ai-picked { border-color: var(--accent); }
  #chatBox { transition: transform .3s ease; }
  @media (max-width: 520px) {  /* 휴대폰: 화면 아래쪽 전체를 채팅창으로 */
    #chatBox.peek { transform: translateY(calc(100% - 56px)); }  /* 강조하는 동안 머리글만 남기고 내림 */
    #chatBox { right: 0; left: 0; bottom: 0; width: 100%; max-width: none; height: 85vh; height: 85dvh; border-radius: 16px 16px 0 0; }
    #chatBox.open + #chatFab, #chatBox.open ~ #chatFab { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1>가격비교</h1>
  <p class="sub">상품명을 입력하면 에이전트가 웹을 검색해 인기 모델 5개를 비교해 드려요.</p>

  <form id="f">
    <input type="search" id="q" placeholder="예: 무선 청소기, 에어팟 프로, 27인치 모니터" required maxlength="100" autofocus>
    <button id="btn">검색</button>
  </form>
  <div class="cond-row">
    <input type="text" id="c" maxlength="100" placeholder="원하는 조건 (선택) · 예: 디자인이 귀여운, 저소음, 5만원 이하, 화이트 색상">
    <div class="cond-chips" id="condChips">
      <button type="button" class="cond-chip">귀여운 디자인</button>
      <button type="button" class="cond-chip">저소음</button>
      <button type="button" class="cond-chip">가성비</button>
      <button type="button" class="cond-chip">가벼움</button>
      <button type="button" class="cond-chip">화이트</button>
    </div>
  </div>
  <div id="status"></div>

  <div id="demo">
    <strong>데모 모드</strong> · 검색 서버에 연결할 수 없어서 저장된 결과만 볼 수 있어요. 아래 최근 검색을 눌러 보세요.
  </div>

  <section id="recent">
    <div class="head"><h2>최근 검색</h2><span class="hint">누르면 저장된 결과를 바로 보여줘요 (검색 횟수 차감 없음)</span></div>
    <div class="chips" id="chips"></div>
  </section>

  <div class="panel" id="loading">
    <div class="spinner"></div>
    <div>에이전트가 검색 중... <span class="na" id="elapsed"></span><br>
      <span class="na" style="font-size:13px">쇼핑몰 가격을 확인하느라 1~3분 정도 걸릴 수 있어요.</span></div>
  </div>
  <div class="panel" id="error"></div>

  <div id="results">
    <div class="result-title"><h2 id="rq"></h2><span class="na" id="rcount"></span></div>
    <div class="req-cond" id="reqCond"></div>
    <div class="panel nomatch" id="nomatch"></div>
    <div class="picks" id="picks"></div>

    <section class="panel" id="tablePanel">
      <div class="table-head">
        <h2>모델별 비교</h2>
        <div class="seg" id="sort" role="group" aria-label="정렬">
          <button type="button" data-sort="default" aria-pressed="true">기본</button>
          <button type="button" data-sort="asc" aria-pressed="false">가격 낮은순</button>
          <button type="button" data-sort="desc" aria-pressed="false">가격 높은순</button>
        </div>
      </div>
      <table id="table">
        <thead><tr><th>모델</th><th class="fit-col">조건 적합도</th><th>가격</th><th>쇼핑몰</th><th>별점</th><th>장점</th><th>단점</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="meta" id="meta"></div>
    </section>
  </div>
</main>

<div id="chatBox" role="dialog" aria-label="상담 챗봇">
  <div class="chat-head"><b>🛍️ 쇼핑 상담<small>지금 보고 있는 검색 결과 안에서 골라 드려요</small></b>
    <button type="button" id="chatClose" aria-label="닫기">×</button></div>
  <div id="chatLog"></div>
  <div id="chatEx">
    <button type="button">자취생한테 뭐가 좋아?</button>
    <button type="button">가성비 하나만 골라줘</button>
    <button type="button">선물용으로 추천해줘</button>
  </div>
  <div id="chatCount"></div>
  <form id="chatForm">
    <input id="chatIn" maxlength="300" placeholder="예산, 용도, 취향을 말해 주세요" autocomplete="off">
    <button id="chatSend">보내기</button>
  </form>
</div>
<button type="button" id="chatFab" aria-label="상담 챗봇 열기">💬</button>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NA = '<span class="na">확인 안 됨</span>';
const fmtPrice = (p, cur) => p == null ? null :
  (!cur || cur === "KRW" ? Number(p).toLocaleString("ko-KR") + "원" : Number(p).toLocaleString() + " " + esc(cur));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : null;
const list = (arr, cls) => arr && arr.length ? `<ul class="pc ${cls}">${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : NA;
const hasPrice = p => typeof p.price === "number";
// 서버가 검증한 상품 페이지 링크만 버튼으로 보여줌. 검증 실패면 "링크 확인 안 됨"
const productUrl = p => p && p.url_verified !== false ? safeUrl(p.url) : null;
const NOLINK = '<span class="nolink">링크 확인 안 됨</span>';
const cleanCond = s => (s || "").trim().split(/\s+/).join(" ");
const FIT_CLASS = { "높음": "high", "보통": "mid", "낮음": "low" };
const fitBadge = f => f ? `<span class="fit ${FIT_CLASS[f] || "low"}">적합도 ${esc(f)}</span>` : "";

// 연결 순서: ① 내 PC 서버(localhost:5000, 무제한) → ② config.js의 ngrok 주소(하루 제한) → ③ 데모 모드
const LOCAL_URL = location.port === "5000" ? "" : "http://localhost:5000";  // Flask가 직접 띄웠으면 같은 주소
const NGROK_URL = String(window.APP_CONFIG?.SERVER_URL || "").trim().replace(/\/+$/, "");
let API_BASE = "";      // connect()에서 연결된 서버 주소로 정해짐
let API_HEADERS = {};
// ngrok 무료 도메인은 처음 접속 시 경고 페이지를 보여주는데, 이 헤더가 있으면 건너뜀
const NGROK_HEADERS = { "ngrok-skip-browser-warning": "1" };

let demoMode = false;
let recentList = [];  // [{query, file, searched_at, count}] — 서버 /history 또는 demo/index.json
const norm = s => s.trim().split(/\s+/).join(" ").toLowerCase();

function setStatus(text, cls = "") {
  $("status").textContent = text;
  $("status").className = cls;
}

function showRemaining(d) {
  if (d && d.unlimited) setStatus("🟢 내 PC 서버 연결됨 (무제한)", "ok");
  else if (d && d.remaining != null) setStatus(`🟢 실시간 검색 가능 (오늘 남은 ${d.remaining}회)`, "ok");
}

// ---------- 원하는 조건 ----------

// 칩을 누르면 조건칸에 추가 (이미 있으면 그대로)
$("condChips").addEventListener("click", e => {
  const word = e.target.closest(".cond-chip")?.textContent;
  if (!word) return;
  const parts = $("c").value.split(",").map(x => x.trim()).filter(Boolean);
  if (!parts.includes(word)) parts.push(word);
  $("c").value = parts.join(", ").slice(0, 100);
  $("c").focus();
});

// ---------- 최근 검색 ----------

async function loadRecent() {
  try {
    const res = demoMode
      ? await fetch("demo/index.json")
      : await fetch(API_BASE + "/history", { headers: API_HEADERS });
    recentList = res.ok ? await res.json() : [];
  } catch (_) {
    recentList = [];
  }
  if (!Array.isArray(recentList)) recentList = [];
  const short = s => (s || "").slice(5, 10).replace("-", "/");  // "2026-11-17 ..." → "11/17"
  $("chips").innerHTML = recentList.length
    ? recentList.map((d, i) => `<button type="button" class="chip" data-i="${i}">${esc(d.query)}${d.condition ? `<span class="cond">· ${esc(d.condition)}</span>` : ""}${d.searched_at ? `<small>${esc(short(d.searched_at))}</small>` : ""}</button>`).join("")
    : '<span class="na">아직 저장된 검색이 없어요.</span>';
  $("recent").style.display = "block";
}

// 저장된 결과 불러오기: Claude를 실행하지 않음
async function fetchSaved(item) {
  const res = demoMode
    ? await fetch("demo/" + encodeURIComponent(item.file))
    : await fetch(API_BASE + "/history/" + encodeURIComponent(item.file), { headers: API_HEADERS });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  data.cached = true;
  return data;
}

$("chips").addEventListener("click", async e => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  const item = recentList[Number(btn.dataset.i)];
  if (!item) return;
  $("q").value = item.query;
  $("c").value = item.condition || "";
  hideError();
  try { render(await fetchSaved(item)); }
  catch (err) { showError("불러오기 실패: " + err.message); }
});

// ---------- 서버 연결 ----------

async function tryHealth(base, headers, ms) {
  try {
    const res = await fetch(base + "/health", { headers, signal: AbortSignal.timeout(ms) });
    const d = res.ok ? await res.json() : null;
    return d && d.ok ? d : null;
  } catch (_) {
    return null;
  }
}

// 페이지가 열리면 내 PC 서버 → ngrok 순서로 연결 시도. 둘 다 안 되면 데모 모드
async function connect() {
  setStatus("검색 서버 연결 확인 중...");
  let d = await tryHealth(LOCAL_URL, {}, 2000);
  if (d) {
    API_BASE = LOCAL_URL;
    API_HEADERS = {};
  } else if (NGROK_URL && (d = await tryHealth(NGROK_URL, NGROK_HEADERS, 5000))) {
    API_BASE = NGROK_URL;
    API_HEADERS = NGROK_HEADERS;
  } else {
    setStatus("");
    return enterDemoMode();
  }
  demoMode = false;
  $("demo").style.display = "none";
  showRemaining(d);
  loadRecent();
}

async function enterDemoMode() {
  demoMode = true;
  $("demo").style.display = "block";
  await loadRecent();
}

async function fetchDemo(q, c) {
  const hit = recentList.find(d => norm(d.query) === norm(q) && norm(d.condition || "") === norm(c));
  if (!hit) {
    const names = recentList.map(d => `"${d.query}${d.condition ? " · " + d.condition : ""}"`).join(", ");
    throw new Error(`데모 모드에서는 저장된 검색어만 볼 수 있어요${names ? ": " + names : "."}`);
  }
  return fetchSaved(hit);
}

async function fetchLive(q, c) {
  let url = API_BASE + "/search?q=" + encodeURIComponent(q);
  if (c) url += "&c=" + encodeURIComponent(c);
  const res = await fetch(url, { headers: API_HEADERS });
  const data = await res.json();
  if (res.status === 429) setStatus(`🟡 오늘 새 검색 횟수를 모두 썼어요 (최근 검색은 계속 볼 수 있어요)`, "bad");
  if (!res.ok) throw new Error(data.error || res.statusText);
  showRemaining(data);
  return data;
}

function showError(msg) {
  $("results").style.display = "none";
  chatReset(null);  // 결과가 화면에서 사라지면 챗봇도 초기화
  $("error").textContent = msg;
  $("error").style.display = "block";
}
function hideError() { $("error").style.display = "none"; }

connect();

// ---------- 검색 ----------

let timer;
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("q").value.trim();
  const c = cleanCond($("c").value);
  if (!q) return;
  hideError();
  if (demoMode) {
    try { render(await fetchDemo(q, c)); }
    catch (err) { showError(err.message); }
    return;
  }
  $("btn").disabled = true;
  $("results").style.display = "none";
  $("loading").style.display = "flex";
  const t0 = Date.now();
  $("elapsed").textContent = "";
  timer = setInterval(() => $("elapsed").textContent = `(${Math.round((Date.now() - t0) / 1000)}초)`, 1000);
  try {
    let data;
    try {
      data = await fetchLive(q, c);
      if (!data.cached) loadRecent();  // 새로 저장된 검색어를 목록에 반영
    } catch (err) {
      if (!(err instanceof TypeError)) throw err;  // TypeError = 서버 연결 자체가 안 됨
      setStatus("");
      await enterDemoMode();
      data = await fetchDemo(q, c);
    }
    render(data);
  } catch (err) {
    showError("검색 실패: " + err.message);
  } finally {
    clearInterval(timer);
    $("loading").style.display = "none";
    $("btn").disabled = false;
  }
});

// ---------- 결과 화면 ----------

let current = null;   // 지금 보여주는 결과 {items, cheapest, valueP, qualityP, max}
let sortMode = "default";

$("sort").addEventListener("click", e => {
  const mode = e.target.dataset?.sort;
  if (!mode) return;
  sortMode = mode;
  for (const b of $("sort").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.sort === mode));
  renderTable();
});

function render(d) {
  const items = d.products || [];
  chatReset(items.length ? d : null);
  const cond = cleanCond(d.condition);   // 조건 없이 검색한 결과(예전 캐시 포함)는 ""
  if (!items.length && !cond) throw new Error("검색 결과가 없어요.");
  const label = p => `${p.brand} ${p.model}`;

  $("rq").textContent = `“${d.query || $("q").value.trim()}” 비교 결과`;
  $("rcount").textContent = `${items.length}개 모델`;
  $("reqCond").innerHTML = cond ? `요청한 조건: <b>${esc(cond)}</b>` : "";
  $("reqCond").style.display = cond ? "block" : "none";
  $("meta").textContent = [
    d.cached ? `저장된 결과 (검색 시각 ${d.searched_at})` : `방금 검색함 (${d.elapsed_sec}초)`,
    d.notes, "가격은 수시로 바뀌니 구매 전 링크에서 다시 확인하세요.",
  ].filter(Boolean).join(" · ");

  // 조건에 맞는 상품이 없을 때: 지어낸 결과 대신 안내만
  $("nomatch").style.display = items.length ? "none" : "block";
  $("picks").style.display = items.length ? "grid" : "none";
  $("tablePanel").style.display = items.length ? "block" : "none";
  if (!items.length) {
    $("nomatch").innerHTML = `<b>조건에 맞는 상품을 못 찾음</b><div class="meta">${esc($("meta").textContent)}</div>`;
    current = null;
    $("results").style.display = "block";
    return;
  }

  // 가성비·품질은 Claude 판단, 최저가는 확인된 가격 중 최솟값
  const findByModel = m => m ? items.find(p => p.model === m || label(p) === m || p.model.includes(m) || m.includes(p.model)) : null;
  const priced = items.filter(hasPrice);
  const cheapest = priced.length ? priced.reduce((a, b) => b.price < a.price ? b : a) : null;
  const valueP = findByModel(d.value_pick?.model);
  const qualityP = findByModel(d.quality_pick?.model);

  const picks = [
    ["value", "💰 가성비 추천", valueP, d.value_pick?.reason, d.value_pick?.model],
    ["quality", "⭐ 품질 추천", qualityP, d.quality_pick?.reason, d.quality_pick?.model],
    ["cheap", "🏷️ 최저가", cheapest, cheapest && "확인된 가격 중 가장 저렴해요.", null],
  ];
  const pid = p => p ? ` data-pid="${items.indexOf(p)}"` : "";   // 챗봇 추천 id = products 순서
  $("picks").innerHTML = picks.map(([cls, tag, p, why, fallbackName]) => {
    if (!p && !fallbackName) {
      return `<div class="pick ${cls} empty"><span class="tag">${tag}</span><p class="why">판단할 정보가 부족해요.</p></div>`;
    }
    const url = productUrl(p);
    const price = p ? fmtPrice(p.price, p.currency) : null;
    return `<div class="pick ${cls}"${pid(p)}><span class="tag">${tag}</span>
      ${p ? `<div class="brand">${esc(p.brand)}</div>` : ""}
      <div class="name">${esc(p ? p.model : fallbackName)}</div>
      ${cond && p ? fitBadge(p.fit) : ""}
      <div class="price">${price ?? '<span class="na" style="font-size:16px;font-weight:400">가격 확인 안 됨</span>'}</div>
      ${p?.store ? `<div class="store">${esc(p.store)}</div>` : ""}
      ${why ? `<p class="why">${esc(why)}</p>` : ""}
      ${url ? `<div class="go"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">상품 보기 →</a></div>`
            : p ? `<div class="go">${NOLINK}</div>` : ""}</div>`;
  }).join("");

  current = { items, cheapest, valueP, qualityP, max: Math.max(...priced.map(p => p.price), 1) };
  $("table").classList.toggle("no-fit", !cond);  // 조건 없으면 적합도 칸 숨김
  renderTable();
  $("results").style.display = "block";
}

function renderTable() {
  if (!current) return;
  const { items, cheapest, valueP, qualityP, max } = current;
  let rows = [...items];
  if (sortMode !== "default") {
    const dir = sortMode === "asc" ? 1 : -1;
    // 가격을 모르는 상품은 정렬 방향과 상관없이 맨 뒤로
    rows.sort((a, b) => hasPrice(a) && hasPrice(b) ? (a.price - b.price) * dir : hasPrice(b) - hasPrice(a));
  }
  $("tbody").innerHTML = rows.map(p => {
    const url = productUrl(p);
    const badges = [
      p === valueP && '<span class="badge value">가성비</span>',
      p === qualityP && '<span class="badge quality">품질</span>',
      p === cheapest && '<span class="badge cheap">최저가</span>',
    ].filter(Boolean).join("");
    const rating = p.rating == null ? NA
      : `★ ${esc(p.rating)}${p.review_count != null ? ` <span class="na">(${Number(p.review_count).toLocaleString()})</span>` : ""}`;
    const price = fmtPrice(p.price, p.currency);
    return `<tr data-pid="${items.indexOf(p)}">
      <td class="model"><span class="brand">${esc(p.brand)}</span><b>${esc(p.model)}</b>${badges ? `<div class="badges">${badges}</div>` : ""}</td>
      <td class="fit-c fit-col" data-label="적합도">${p.fit ? fitBadge(p.fit) : NA}${p.fit_reason ? `<span class="fit-why">${esc(p.fit_reason)}</span>` : ""}</td>
      <td class="price" data-label="가격">${price ?? NA}${price ? `<div class="mini"><i style="width:${Math.max(3, p.price / max * 100)}%"></i></div>` : ""}</td>
      <td class="store-c" data-label="쇼핑몰">${p.store ? esc(p.store) : NA}</td>
      <td class="rating" data-label="별점">${rating}</td>
      <td class="pc-cell" data-label="장점">${list(p.pros, "pros")}</td>
      <td class="pc-cell" data-label="단점">${list(p.cons, "cons")}</td>
      <td class="link">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">상품 보기</a>` : NOLINK}</td></tr>`;
  }).join("");
  restoreAiBadge();   // 정렬로 표를 다시 그려도 "AI 추천" 배지 유지
}

// ---------- 상담 챗봇 ----------

const CHAT_MAX = 300;
let chatResult = null;   // 챗봇에 보낼 지금 화면의 검색 결과
let chatHistory = [];    // [{role: "user"|"assistant", text}] 최근 대화
let chatBusy = false;

function chatAdd(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;   // textContent라서 답변에 HTML이 있어도 실행되지 않음
  $("chatLog").appendChild(div);
  $("chatLog").scrollTop = $("chatLog").scrollHeight;
  return div;
}

function chatSetEnabled() {
  const off = chatBusy || !chatResult || demoMode;
  $("chatSend").disabled = off;
  $("chatIn").disabled = !chatResult || demoMode;
  for (const b of $("chatEx").querySelectorAll("button")) b.disabled = off;
}

// 새 검색 결과가 화면에 뜨면 대화 내용 초기화
function chatReset(result) {
  clearAiBadge();
  chatResult = result;
  chatHistory = [];
  $("chatLog").innerHTML = "";
  $("chatCount").textContent = "";
  if (!result) chatAdd("info", "먼저 상품을 검색해주세요.");
  else if (demoMode) chatAdd("info", "데모 모드에서는 챗봇을 쓸 수 없어요. 검색 서버에 연결되면 이용할 수 있어요.");
  else chatAdd("info", `“${result.query || ""}” 검색 결과로 상담해 드려요.\n예산·용도·취향을 알려 주세요.`);
  chatSetEnabled();
}

async function chatAsk(question) {
  question = question.trim().split(/\s+/).join(" ");
  if (!question || chatBusy || !chatResult || demoMode) return;
  if (question.length > CHAT_MAX) return chatAdd("err", `질문은 ${CHAT_MAX}자까지 쓸 수 있어요.`);
  const sentFor = chatResult;
  clearAiBadge();   // 다음 질문을 하면 이전 추천 배지 제거
  chatAdd("user", question);
  $("chatIn").value = "";
  chatBusy = true; chatSetEnabled();
  const wait = chatAdd("bot wait", "답변을 생각하는 중...");
  try {
    const res = await fetch(API_BASE + "/chat", {
      method: "POST",
      headers: { ...API_HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({ question, results: chatResult, history: chatHistory.slice(-6) }),
    });
    const data = await res.json().catch(() => ({}));
    if (sentFor !== chatResult) return;   // 기다리는 동안 새 검색을 했으면 버림
    wait.remove();
    if (data.unlimited === false && data.remaining != null) $("chatCount").textContent = `오늘 남은 대화 ${data.remaining}회`;
    if (!res.ok) throw new Error(data.error || "잠시 후 다시 시도해주세요.");
    chatAddAnswer(data.answer, data.pick_id);
    if (data.pick_id != null) highlightProduct(data.pick_id);   // 답변이 오면 추천 상품을 한 번 강조
    chatHistory.push({ role: "user", text: question }, { role: "assistant", text: data.answer });
    chatHistory = chatHistory.slice(-6);
  } catch (err) {
    if (sentFor !== chatResult) return;
    wait.remove();
    chatAdd("err", err instanceof TypeError ? "서버에 연결할 수 없어요. 잠시 후 다시 시도해주세요." : err.message);
  } finally {
    chatBusy = false; chatSetEnabled();
  }
}

// 서버가 검증한 추천 id가 지금 결과에 있을 때만 사용 (없는 상품이면 null → 강조 안 함)
const validPick = id => Number.isInteger(id) && chatResult?.products?.[id] ? id : null;

// 답변 표시: "추천:" 줄의 상품명을 링크로. 그런 줄이 없으면 "결과에서 보기" 링크를 덧붙임
function chatAddAnswer(text, pickId) {
  const pid = validPick(pickId);
  const div = chatAdd("bot", "");
  const link = label => {
    const a = document.createElement("a");
    a.href = "#"; a.className = "pick-link"; a.textContent = label;
    a.addEventListener("click", e => { e.preventDefault(); highlightProduct(pid); });
    return a;
  };
  let linked = false;
  text.split("\n").forEach((line, i) => {
    if (i) div.appendChild(document.createTextNode("\n"));
    const m = pid != null && !linked && line.match(/^(\s*추천\s*[:：]\s*)(.+)$/);
    if (m) {
      div.append(m[1], link(m[2]));
      linked = true;
    } else {
      div.appendChild(document.createTextNode(line));
    }
  });
  if (pid != null && !linked) {
    const see = link("👉 결과에서 보기");
    see.className = "see";
    div.append("\n", see);
  }
  $("chatLog").scrollTop = $("chatLog").scrollHeight;
}

// "✨ AI 추천" 배지: 카드면 오른쪽 위, 표의 행이면 모델명 칸 맨 위
let aiPick = null;   // {pid, kind: "card"|"row"} 지금 배지가 붙은 상품
function addAiBadge(target) {
  target.classList.add("ai-picked");
  const host = target.matches("tr") ? target.querySelector("td.model") : target;
  if (!host || host.querySelector(":scope > .ai-badge")) return;
  const b = document.createElement("span");
  b.className = "ai-badge";
  b.textContent = "✨ AI 추천";
  host.prepend(b);
}
function clearAiBadge() {
  aiPick = null;
  document.querySelectorAll(".ai-badge").forEach(b => b.remove());
  document.querySelectorAll(".ai-picked").forEach(el => el.classList.remove("ai-picked"));
}
function restoreAiBadge() {
  if (aiPick?.kind !== "row") return;
  const row = document.querySelector(`#tbody tr[data-pid="${aiPick.pid}"]`);
  if (row) addAiBadge(row);
}

// 추천 상품 카드(없으면 표의 행)로 부드럽게 스크롤하고 2.5초 동안 강조 + "AI 추천" 배지
let peekTimer, flashTimer, flashTarget;
function highlightProduct(pickId) {
  const pid = validPick(pickId);
  if (pid == null || $("results").style.display === "none") return;
  const visible = el => el && el.offsetParent !== null;
  const target = [...document.querySelectorAll(`.pick[data-pid="${pid}"]`)].find(visible)
              || [...document.querySelectorAll(`#tbody tr[data-pid="${pid}"]`)].find(visible);
  if (!target) return;
  // 휴대폰: 채팅창이 화면을 덮으므로 잠깐 내려서 카드가 보이게
  if ($("chatBox").classList.contains("open") && matchMedia("(max-width: 520px)").matches) {
    $("chatBox").classList.add("peek");
    clearTimeout(peekTimer);
    peekTimer = setTimeout(() => $("chatBox").classList.remove("peek"), 3000);
  }
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  if (aiPick && aiPick.pid !== pid) clearAiBadge();
  aiPick = { pid, kind: target.matches("tr") ? "row" : "card" };
  addAiBadge(target);
  clearTimeout(flashTimer);
  flashTarget?.classList.remove("flash");
  void target.offsetWidth;          // 다시 눌러도 애니메이션이 처음부터 나오게
  target.classList.add("flash");
  flashTarget = target;
  flashTimer = setTimeout(() => target.classList.remove("flash"), 2600);
}

// 내려간 채팅창 머리글을 누르면 바로 다시 올림
$("chatBox").addEventListener("click", e => {
  if ($("chatBox").classList.contains("peek") && e.target.closest(".chat-head") && e.target.id !== "chatClose") {
    clearTimeout(peekTimer);
    $("chatBox").classList.remove("peek");
  }
});

$("chatFab").addEventListener("click", () => {
  const open = $("chatBox").classList.toggle("open");
  if (open && !chatResult && !$("chatLog").children.length) chatReset(null);
  if (open && !$("chatIn").disabled) $("chatIn").focus();
});
$("chatClose").addEventListener("click", () => $("chatBox").classList.remove("open", "peek"));
$("chatForm").addEventListener("submit", e => { e.preventDefault(); chatAsk($("chatIn").value); });
$("chatEx").addEventListener("click", e => { if (e.target.tagName === "BUTTON") chatAsk(e.target.textContent); });
chatReset(null);
</script>
</body>
</html>
